<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reach Academy | Preparación Académica e Internacional</title>
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts: Cinzel, Inter, Lora -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=Lora:ital@1&display=swap" rel="stylesheet">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- BARRA DE INICIO -->
    <nav class="navbar navbar-expand-lg fixed-top custom-navbar">
        <div class="container">
            <a class="navbar-brand brand-title" href="#">REACH ACADEMY</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item"><a class="nav-link active" href="#inicio">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#programas">Programas</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contacto">Contacto</a></li>
                    <li class="nav-item ms-lg-3">
                        <a class="btn btn-reach-orange" href="#contacto">Prueba de Nivelación</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- BARRA DE INICIO FIN -->

    <header id="inicio" class="hero-section d-flex align-items-center justify-content-center text-center text-white">
        <div class="hero-overlay"></div>
        <div class="container position-relative z-1 my-auto py-5">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <h1 class="hero-title mb-3">Helping you reach your goals</h1>
                    <p class="hero-subtitle mb-4">Preparación académica e internacional para tu éxito</p>
                    <div class="hero-search-bar p-3 p-md-4 rounded-3 shadow-lg">
                        <form class="row g-3 align-items-center justify-content-center">
                            <div class="col-12 col-md-4">
                                <label class="form-label text-start w-100 mb-1 fw-semibold text-lightSmall">Soy</label>
                                    <select id="selectPerfil" class="form-select custom-select">
                                        <option value="Estudiante" selected>Estudiante</option>
                                        <option value="Representante">Representante</option>
                                    </select>
                            </div>
                            <div class="col-12 col-md-5">
                                <label class="form-label text-start w-100 mb-1 fw-semibold text-lightSmall">y me interesa</label>
                                    <select id="selectInteres" class="form-select custom-select">
                                        <option value="Idiomas" selected>Idiomas</option>
                                        <option value="Tutorías Bachillerato">Tutorías Bachillerato</option>
                                        <option value="Preparación para Exámenes">Preparación para Exámenes</option>
                                        <option value="Admisión Universitaria">Admisión Universitaria</option>
                                    </select>
                            </div>
                            <div class="col-12 col-md-3 d-flex align-items-end">
                                <button type="button" id="btnExplorar" class="btn btn-reach-orange w-100 py-2 mt-md-4">Explorar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
</body>
</html>
